=<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night 1 - Five Nights at the Black House</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
            user-select: none; 
        }

        /* --- 1. The Panning Office Background (Two Layers) --- */
        .office-layer {
            position: absolute;
            top: 0; left: 0;
            width: 150vw; 
            height: 100vh;
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: transform 0.1s ease-out;
        }
        #office-bg-1 { opacity: 1; }
        #office-bg-2 { opacity: 0; }

        /* --- 2. Invisible Door Hitboxes --- */
        .door-zone {
            position: absolute;
            top: 0;
            width: 10vw; 
            height: 100vh;
            z-index: 20;
            cursor: pointer;
        }
        #left-door-zone { left: 0; }
        #right-door-zone { right: 0; }

        /* --- 3. Separated UI Panels --- */
        .ui-panel {
            position: absolute;
            bottom: 0;
            height: 250px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #444;
            border-bottom: none;
            border-radius: 2px; /* Sharp corners */
            z-index: 30;
            transition: transform 0.3s ease 0s;
        }
        .ui-panel:hover {
            transition: transform 0.3s ease 0.2s; 
        }

        /* Left Panel: Tasks */
        #panel-tasks {
            left: 0;
            width: 300px;
            transform: translateY(70%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #panel-tasks:hover { transform: translateY(0); }

        /* Right Panel: Controls */
        #panel-controls {
            right: 0;
            width: 300px;
            transform: translateY(70%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #panel-controls:hover { transform: translateY(0); }

        /* Middle Bar: Cameras */
        #bar-cameras {
            left: 50%;
            transform: translateX(-50%) translateY(70%);
            width: 150px;
            background: #1a1a1a;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #bar-cameras:hover { transform: translateX(-50%) translateY(0); }

        .section-title {
            font-size: 1rem;
            color: #888;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* --- System Buttons --- */
        .sys-btn {
            background: #222;
            color: #ccc;
            border: 2px solid #555;
            border-radius: 2px; /* Sharp corners */
            padding: 12px;
            margin-bottom: 10px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            min-width: 220px;
            text-align: center;
        }
        .sys-btn:hover {
            background: #444;
            color: #fff;
            border-color: #fff;
        }
        .sys-btn.completed {
            color: #00ff00;
            border-color: #00ff00;
            pointer-events: none;
        }

        /* --- 4-Bar Breaker Switch --- */
        .breaker-grid {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        .breaker-bar {
            width: 40px;
            height: 100px;
            background: #111;
            border: 2px solid #333;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }
        .breaker-handle {
            width: 32px;
            height: 30px;
            background: #ffbb00;
            border-radius: 2px;
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            transition: top 0.15s ease, background 0.15s;
        }
        /* When a bar is pulled down */
        .breaker-bar.off .breaker-handle {
            top: 65px;
            background: #444;
        }
        .breaker-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* --- Camera Panel --- */
        #camera-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #050505;
            z-index: 50;
            display: none; 
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        /* --- VHS Overlay --- */
        #vhs-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 999;
            mix-blend-mode: overlay;
        }
        #vhs-overlay::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3), rgba(0,0,0,0.3) 1px, transparent 1px, transparent 3px);
            opacity: 0.5;
        }
        #vhs-overlay::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.1;
            animation: grainShift 0.2s steps(2) infinite;
        }
        @keyframes grainShift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(-5%, 5%); }
            100% { transform: translate(5%, -5%); }
        }

        /* --- Light Flash Effect --- */
        #flash-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #fff;
            z-index: 950;
            opacity: 0;
            pointer-events: none;
        }
        @keyframes lightFlashAnim {
            0% { opacity: 0; }
            20% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        .flashing { animation: lightFlashAnim 0.15s ease-out; }

        /* --- Win Screen Overlay --- */
        #win-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }
        #win-text {
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 20px #fff;
        }
    </style>
</head>
<body>

    <!-- Two Background Layers to prevent black flashing -->
    <div id="office-bg-1" class="office-layer"></div>
    <div id="office-bg-2" class="office-layer"></div>

    <!-- Invisible Hitboxes -->
    <div id="left-door-zone" class="door-zone" onclick="toggleDoor('left')"></div>
    <div id="right-door-zone" class="door-zone" onclick="toggleDoor('right')"></div>

    <!-- Left UI: Tasks -->
    <div id="panel-tasks" class="ui-panel">
        <div class="section-title">Tasks</div>
        <button id="btn-task1" class="sys-btn" onclick="doTask(1)">Deport Liberals (0/5)</button>
        <button id="btn-task2" class="sys-btn" onclick="doTask(2)">Send Missiles (0/1)</button>
    </div>

    <!-- Middle UI: Cameras -->
    <div id="bar-cameras" class="ui-panel" onclick="toggleCameras()">
        <div class="section-title">Cams</div>
        <div style="font-size: 0.7rem; color: #555; writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 3px;">PRESS SPACE</div>
    </div>

    <!-- Right UI: Controls -->
    <div id="panel-controls" class="ui-panel">
        <div class="section-title">Breaker</div>
        <div class="breaker-grid">
            <div class="breaker-bar" onclick="toggleBreaker(0)"><div class="breaker-handle"></div></div>
            <div class="breaker-bar" onclick="toggleBreaker(1)"><div class="breaker-handle"></div></div>
            <div class="breaker-bar" onclick="toggleBreaker(2)"><div class="breaker-handle"></div></div>
            <div class="breaker-bar" onclick="toggleBreaker(3)"><div class="breaker-handle"></div></div>
        </div>
        <div class="breaker-label" id="breaker-label">LIGHTS: ON</div>
    </div>

    <!-- Camera Panel -->
    <div id="camera-panel">
        <h1>CAMERA SYSTEM OFFLINE</h1>
        <p style="color: #555; margin-top: 10px;">[ Press SPACE or click bar to close ]</p>
    </div>

    <!-- Flash & VHS Overlays -->
    <div id="flash-overlay"></div>
    <div id="vhs-overlay"></div>

    <!-- Win Screen -->
    <div id="win-overlay">
        <div id="win-text">6:00 AM</div>
    </div>

    <script>
        // --- Preload Images ---
        const imageNames = [
            "Alldoors-openNormal", "Alldoors-openBlackout",
            "Leftdoor-openNormal", "Leftdoor-openBlackout",
            "Rightdoor-openNormal", "Rightdoor-openBlackout",
            "Alldoors-closedNormal", "Alldoors-closedBlackout"
        ];
        imageNames.forEach(name => {
            const ext = name === "Alldoors-closedNormal" ? ".png" : ".jpg";
            const img = new Image();
            img.src = `../GameAssets/${name}${ext}`;
        });

        // --- State Variables ---
        let leftDoorClosed = false;
        let rightDoorClosed = false;
        let lightsOn = true;
        let isCameraOpen = false;
        
        let task1Progress = 0;
        const task1Max = 5;
        let task2Progress = 0;
        const task2Max = 1;
        let tasksCompleted = 0;
        const totalTasks = 2;

        // Breaker state (4 bars)
        let breakerStates = [false, false, false, false]; // false = UP (ON), true = DOWN (OFF)

        const layer1 = document.getElementById('office-bg-1');
        const layer2 = document.getElementById('office-bg-2');
        let activeLayer = 1;
        let currentBgUrl = "";

        const maxPan = window.innerWidth * 0.5; 

        // --- Panning Logic ---
        document.addEventListener('mousemove', (e) => {
            if (isCameraOpen) return;
            const percentage = e.clientX / window.innerWidth;
            const panAmount = -(percentage * maxPan);
            // Move both layers so the swap is seamless
            layer1.style.transform = `translateX(${panAmount}px)`;
            layer2.style.transform = `translateX(${panAmount}px)`;
        });

        // --- Dynamic Office Image Logic (No Flash) ---
        function updateOfficeImage() {
            let baseName = "Alldoors-open";
            
            if (leftDoorClosed && rightDoorClosed) {
                baseName = "Alldoors-closed";
            } else if (leftDoorClosed && !rightDoorClosed) {
                baseName = "Rightdoor-open"; 
            } else if (!leftDoorClosed && rightDoorClosed) {
                baseName = "Leftdoor-open"; 
            }

            const lightState = lightsOn ? "Normal" : "Blackout";
            const ext = (baseName === "Alldoors-closed" && lightsOn) ? ".png" : ".jpg";
            const newUrl = `url('../GameAssets/${baseName}${lightState}${ext}')`;

            if (newUrl === currentBgUrl) return; // Don't swap if nothing changed

            // Load new image into the inactive layer, then swap opacity
            if (activeLayer === 1) {
                layer2.style.backgroundImage = newUrl;
                layer2.style.opacity = '1';
                layer1.style.opacity = '0';
                activeLayer = 2;
            } else {
                layer1.style.backgroundImage = newUrl;
                layer1.style.opacity = '1';
                layer2.style.opacity = '0';
                activeLayer = 1;
            }
            currentBgUrl = newUrl;
        }

        // --- Door Logic ---
        function toggleDoor(side) {
            if (side === 'left') {
                leftDoorClosed = !leftDoorClosed;
            } else {
                rightDoorClosed = !rightDoorClosed;
            }
            updateOfficeImage();
        }

        // --- 4-Bar Breaker Logic ---
        function toggleBreaker(index) {
            breakerStates[index] = !breakerStates[index];
            
            // Update Visual
            const bars = document.querySelectorAll('.breaker-bar');
            if (breakerStates[index]) {
                bars[index].classList.add('off');
            } else {
                bars[index].classList.remove('off');
            }

            // Check if all 4 are down
            const allDown = breakerStates.every(state => state === true);
            const label = document.getElementById('breaker-label');

            if (allDown && lightsOn) {
                // Turn lights off
                lightsOn = false;
                label.innerText = "LIGHTS: OFF";
                label.style.color = "#ff0000";
                triggerFlash();
                updateOfficeImage();
            } else if (!allDown && !lightsOn) {
                // Turn lights back on
                lightsOn = true;
                label.innerText = "LIGHTS: ON";
                label.style.color = "#888";
                triggerFlash();
                updateOfficeImage();
            }
        }

        function triggerFlash() {
            const flash = document.getElementById('flash-overlay');
            flash.classList.remove('flashing');
            void flash.offsetWidth; 
            flash.classList.add('flashing');
        }

        // --- Task Logic ---
        function doTask(taskId) {
            if (taskId === 1) {
                if (task1Progress < task1Max) {
                    task1Progress++;
                    document.getElementById('btn-task1').innerText = `Deport Liberals (${task1Progress}/${task1Max})`;
                    if (task1Progress === task1Max) {
                        document.getElementById('btn-task1').classList.add('completed');
                        document.getElementById('btn-task1').innerText = "Deportation Complete";
                        tasksCompleted++;
                        checkWin();
                    }
                }
            } else if (taskId === 2) {
                if (task2Progress < task2Max) {
                    task2Progress++;
                    document.getElementById('btn-task2').innerText = `Send Missiles (${task2Progress}/${task2Max})`;
                    if (task2Progress === task2Max) {
                        document.getElementById('btn-task2').classList.add('completed');
                        document.getElementById('btn-task2').innerText = "Missiles Launched";
                        tasksCompleted++;
                        checkWin();
                    }
                }
            }
        }

        // --- Camera Logic ---
        function toggleCameras() {
            isCameraOpen = !isCameraOpen;
            const panel = document.getElementById('camera-panel');
            panel.style.display = isCameraOpen ? 'flex' : 'none';
        }

        // Spacebar for cameras
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); 
                toggleCameras();
            }
        });

        // --- Win Condition ---
        function checkWin() {
            if (tasksCompleted === totalTasks) {
                const overlay = document.getElementById('win-overlay');
                overlay.style.display = 'flex';
                setTimeout(() => {
                    overlay.style.opacity = '1';
                }, 50);
                
                setTimeout(() => {
                    window.location.href = '../title.html';
                }, 5000);
            }
        }

        // --- Initialize ---
        updateOfficeImage();
    </script>
</body>
</html>
